---
- name: DNS Server Setup
  hosts: dns
  become: yes

  tasks:

    - name: Refresh package list
      apt:
        update_cache: yes

    - name: Install BIND9 and required utilities
      apt:
        name:
          - bind9
          - bind9utils
          - dnsutils
        state: present

    - name: Deploy TSIG key for DDNS
      copy:
        src: ddns.key
        dest: /etc/bind/ddns.key
        owner: root
        group: bind
        mode: "0640"

    - name: Install named.conf.options configuration
      copy:
        src: named.conf.options
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0644"

    - name: Install named.conf.local configuration
      copy:
        src: named.conf.local
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: "0644"

    - name: Place forward zone file (gustavo.test.dns)
      copy:
        src: gustavo.test.dns
        dest: /var/lib/bind/gustavo.test.dns
        owner: bind
        group: bind
        mode: "0644"

    - name: Place reverse zone file (gustavo.test.rev)
      copy:
        src: gustavo.test.rev
        dest: /var/lib/bind/gustavo.test.rev
        owner: bind
        group: bind
        mode: "0644"

    - name: Ensure bind9 is restarted
      service:
        name: bind9
        state: restarted
